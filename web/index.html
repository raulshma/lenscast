<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LensCast — Remote camera control dashboard. Live stream, capture, and manage your Android camera from any browser." />
  <title>LensCast — Camera Control</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <!--
    PWA installability + Web Push. There is NO app-shell service worker on
    purpose: LensCast is a live streaming dashboard (MJPEG/HLS/WebSockets) and
    a cached shell would serve stale UI or break stream reconnects —
    installability works from the manifest alone. The one exception is
    /push-sw.js (from public/), registered on demand by the Web Push card:
    a minimal, cache-free worker that only surfaces encrypted detection-alert
    pushes (RFC 8291/VAPID from the phone) as notifications. Chrome accepts
    the SVG logo as the install icon (sizes "any", purpose "any"); iOS
    ignores apple-touch-icon in SVG but degrades to the favicon/favicon-less
    tile, and iOS cannot receive these pushes (no Web Push outside home-screen
    web apps on that platform).
  -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <!-- Pre-paint UI mode + theme: applies the persisted classic/next UI mode
       and theme before first paint so an opted-in user never sees a flash of
       the wrong look. Classic semantics: light adds data-theme="light", dark
       is the attribute's absence. Next (console) semantics, own storage key:
       light adds data-theme="light", dark is the absence. Only one shell is
       mounted at a time, so the disjoint attribute values stay consistent. -->
  <script>
    (function () {
      try {
        var root = document.documentElement
        var ui = localStorage.getItem('lenscast.ui') === 'next' ? 'next' : 'classic'
        root.setAttribute('data-ui', ui)
        if (ui === 'next') {
          if (localStorage.getItem('lenscast.nextTheme') === 'light') {
            root.setAttribute('data-theme', 'light')
          }
        } else if (localStorage.getItem('lenscast.theme') === 'light') {
          root.setAttribute('data-theme', 'light')
        }
      } catch (e) {
        /* Storage unavailable — the runtime defaults apply. */
      }
    })()
  </script>
  <!-- Fonts are self-hosted via @fontsource imports in src/index.tsx: the
       dashboard is used on isolated LANs and offline, and must not contact
       any third party. -->
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script src="/src/index.tsx" type="module"></script>
</body>
</html>
