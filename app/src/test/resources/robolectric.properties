# The default Robolectric Application for every test class that does not
# pin one in @Config(application = ...). android.app.Application — NOT the
# manifest's MainApplication — because Robolectric builds a fresh
# Application (and runs its onCreate) for every test method, and
# MainApplication's onCreate wires the settings applier, the monitors, and
# the watchdogs onto appScope coroutines that outlive the test method: each
# of the suite's ~200 manifest-default Robolectric methods leaked one more
# copy, and by the late-alphabet classes the JVM carried hundreds of
# competing collectors — the DataStore fanout lagged past 90 s (the
# SettingsWebHandlerSecretTest "gate defaults never propagated" stall) and
# MockWebServer/poll waits stretched 45 s past their milliseconds-scale
# work. Nothing in the suite reads the real graph: every production
# resolution point casts `as? MainApplication` (and no-ops when the cast
# fails), so the plain base class is the honest composition — tests that
# need a specific application keep their @Config override.
application=android.app.Application
