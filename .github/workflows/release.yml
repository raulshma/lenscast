name: Release

on:
  push:
    branches:
      - 'v[0-9]+*'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > lenscast-release.jks

      - name: Calculate Release Version
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # First dotted-number group in the branch name, e.g. v0.1.2 or
          # release/v0.1.2 -> 0.1.2. Plain ERE only: the old pattern used
          # (?:...) non-capturing groups, which GNU grep treats differently
          # across versions and silently failed to match on CI.
          BASE_VERSION=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.0"; fi

          IFS='.' read -r major minor patch <<< "$BASE_VERSION"
          minor=${minor:-0}
          patch=${patch:-0}

          BASE_PREFIX="v${major}.${minor}"

          latest_tag=$(git tag -l "${BASE_PREFIX}.*" | sort -V | tail -n 1)

          if [ -n "$latest_tag" ]; then
              latest_patch=${latest_tag##*.}
              new_patch=$((latest_patch + 1))
              NEW_TAG="${BASE_PREFIX}.${new_patch}"
              NEW_APK_VERSION="${major}.${minor}.${new_patch}"
          else
              NEW_TAG="${BASE_PREFIX}.${patch}"
              NEW_APK_VERSION="${major}.${minor}.${patch}"
          fi

          echo "Next tag computing to: $NEW_TAG"
          echo "Next APK version: $NEW_APK_VERSION"

          # versionCode = major*10_000 + minor*100 + patch*10 + abiIndex
          # (armeabi-v7a=1, arm64-v8a=2, x86_64=3; 0.1.2 -> 1021/1022/1023).
          # Must match app/build.gradle.kts and strictly increase.
          IFS='.' read -r vc_major vc_minor vc_patch <<< "$NEW_APK_VERSION"
          VERSION_BASE=$((vc_major * 10000 + vc_minor * 100 + vc_patch * 10))
          echo "versionCode base (abi index appended per ABI): $VERSION_BASE"

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "apk_version=$NEW_APK_VERSION" >> $GITHUB_OUTPUT
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT

      - name: Build Android App (Release, one APK per ABI)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          abi_index() { case "$1" in armeabi-v7a) echo 1;; arm64-v8a) echo 2;; x86_64) echo 3;; esac; }
          shopt -s nullglob
          mkdir -p out
          for abi in armeabi-v7a arm64-v8a x86_64; do
            VC=$((${{ steps.version.outputs.version_base }} + $(abi_index "$abi")))
            echo "::group::Building $abi (versionCode $VC)"
            ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.apk_version }}" -PversionCode="$VC" -PabiFilter="$abi"
            for apk in app/build/outputs/apk/*/release/app-*-release.apk; do
              mv "$apk" "out/lenscast-${apk#*outputs/apk/}-${abi}-vc${VC}.apk"
            done
            echo "::endgroup::"
          done
          mv out/*.apk .
          rmdir out

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "Release ${{ steps.version.outputs.tag }}"
          files: lenscast-*.apk
          generate_release_notes: true
