name: Release

on:
  push:
    branches:
      - 'v[0-9]+*'
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (via undici 8) requires Node >= 22.19; Node 20 crashes
          # vitest workers at CacheStorage init even though tests pass.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # JDK 21 matches the Gradle daemon toolchain
      # (gradle/gradle-daemon-jvm.properties); setup-java only bootstraps
      # it, the daemon JVM criteria pick the exact version.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > lenscast-release.jks

      - name: Calculate Release Version
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          # First dotted-number group in the branch name, e.g. v0.1.2 or
          # release/v0.1.2 -> 0.1.2. Plain ERE only: the old pattern used
          # (?:...) non-capturing groups, which GNU grep treats differently
          # across versions and silently failed to match on CI.
          BASE_VERSION=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+(\.[0-9]+)+' | head -n 1)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.0"; fi

          IFS='.' read -r major minor patch <<< "$BASE_VERSION"
          minor=${minor:-0}
          patch=${patch:-0}

          BASE_PREFIX="v${major}.${minor}"

          # Stable-shaped tags only: the beta channel (beta.yml) publishes
          # v<base>-beta.<n> tags that match this glob, and sort -V ranks
          # v0.2.2-beta.2 above v0.2.1 — without the filter the "next
          # patch" would read the beta's counter and compute v0.2.3.
          latest_tag=$(git tag -l "${BASE_PREFIX}.*" | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -n 1)

          if [ -n "$latest_tag" ]; then
              latest_patch=${latest_tag##*.}
              new_patch=$((latest_patch + 1))
              NEW_TAG="${BASE_PREFIX}.${new_patch}"
              NEW_APK_VERSION="${major}.${minor}.${new_patch}"
          else
              NEW_TAG="${BASE_PREFIX}.${patch}"
              NEW_APK_VERSION="${major}.${minor}.${patch}"
          fi

          echo "Next tag computing to: $NEW_TAG"
          echo "Next APK version: $NEW_APK_VERSION"

          # versionCode = major*10_000 + minor*1_000 + patch*10 + abiIndex
          # (armeabi-v7a=1, arm64-v8a=2, x86_64=3; 0.1.2 -> 1021/1022/1023,
          # 1.0.0 -> 10001/10002/10003). Must match app/build.gradle.kts,
          # the fdroid recipe, and strictly increase.
          IFS='.' read -r vc_major vc_minor vc_patch <<< "$NEW_APK_VERSION"
          VERSION_BASE=$((vc_major * 10000 + vc_minor * 1000 + vc_patch * 10))
          echo "versionCode base (abi index appended per ABI): $VERSION_BASE"

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "apk_version=$NEW_APK_VERSION" >> $GITHUB_OUTPUT
          echo "version_base=$VERSION_BASE" >> $GITHUB_OUTPUT
          # The fastlane changelog ships per versionCode; the x86_64 entry
          # (abiIndex 3) is the release's canonical one for the notes.
          echo "changelog_vercode=$((VERSION_BASE + 3))" >> $GITHUB_OUTPUT

      - name: Verify Release Changelog Exists
        env:
          CHANGELOG_VERCODE: ${{ steps.version.outputs.changelog_vercode }}
        run: |
          # body_path below points at this file; softprops/action-gh-release
          # silently publishes an empty body when it is missing, so fail here
          # instead — the vercode is computed exactly like the release step
          # (version base + x86_64 abiIndex 3).
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CHANGELOG_VERCODE}.txt"
          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "::error::Missing or empty changelog: $CHANGELOG_FILE"
            echo "::error::Add the release notes for versionCode ${CHANGELOG_VERCODE} before pushing the release branch."
            exit 1
          fi
          echo "Changelog found: $CHANGELOG_FILE"
          cat "$CHANGELOG_FILE"

      - name: Verify Gradle Version Literals Match The Release
        env:
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
          VERSION_BASE: ${{ steps.version.outputs.version_base }}
        run: |
          # F-Droid (UpdateCheckMode: Tags) parses the versionCode/versionName
          # literals out of app/build.gradle.kts at the tagged commit; the
          # -P overrides below only affect the APKs we upload, not what
          # fdroidbot reads. v0.2.1 was tagged before its bump landed, so the
          # bot parsed 0.2.0 there and silently skipped the release. Fail
          # fast when the checked-out tree's literals lag the release.
          GRADLE_FILE="app/build.gradle.kts"
          EXPECTED_VC=$((VERSION_BASE + 3))
          GRADLE_VN=$(grep -E '^[[:space:]]*versionName = "' "$GRADLE_FILE" | head -n1 | cut -d'"' -f2)
          GRADLE_VC=$(grep -E '^[[:space:]]*versionCode = [0-9]+' "$GRADLE_FILE" | head -n1 | grep -oE '[0-9]+$')
          STATUS=0
          if [ "$GRADLE_VN" != "$APK_VERSION" ]; then
            echo "::error::$GRADLE_FILE says versionName \"$GRADLE_VN\"; release computes \"$APK_VERSION\"."
            echo "::error::Commit the version bump to the release branch before pushing it, or fdroidbot will not see this release."
            STATUS=1
          fi
          if [ "$GRADLE_VC" != "$EXPECTED_VC" ]; then
            echo "::error::$GRADLE_FILE says versionCode $GRADLE_VC; release computes $EXPECTED_VC (base + x86_64 abiIndex 3)."
            STATUS=1
          fi
          exit $STATUS

      - name: Run Test Suite (web + app + wear)
        run: |
          ./gradlew :app:testStoreDebugUnitTest :app:testFdroidDebugUnitTest \
            :wear:testDebugUnitTest :wear:assembleDebug
          (cd web && npm ci && npm run typecheck && npm run test)

      - name: Build Android App (Release, one APK per ABI)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          abi_index() { case "$1" in armeabi-v7a) echo 1;; arm64-v8a) echo 2;; x86_64) echo 3;; esac; }
          mkdir -p out
          for abi in armeabi-v7a arm64-v8a x86_64; do
            VC=$((${{ steps.version.outputs.version_base }} + $(abi_index "$abi")))
            echo "::group::Building store/$abi (versionCode $VC)"
            # Store flavor only: it is the flavor GitHub users install. The
            # fdroid flavor is built by F-Droid's own recipe; uploading it
            # here would also give the in-app updater a no-updater APK to
            # wrongly pick (assets sort fdroid-first).
            ./gradlew assembleStoreRelease -PversionName="${{ steps.version.outputs.apk_version }}" -PversionCode="$VC" -PabiFilter="$abi"
            mv app/build/outputs/apk/store/release/app-store-release.apk \
              "out/lenscast-${{ steps.version.outputs.apk_version }}-${abi}-vc${VC}.apk"
            echo "::endgroup::"
          done
          mv out/*.apk .
          rmdir out

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "Release ${{ steps.version.outputs.tag }}"
          files: lenscast-*.apk
          body_path: fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.changelog_vercode }}.txt
          draft: true
          generate_release_notes: true
          # Draft releases create their tag only at publish time, and
          # target_commitish defaults to the default branch — publish the
          # draft before the version bump lands on main and the tag is born
          # at a commit whose literals still say the PREVIOUS version.
          # That exact miss shipped v0.2.1: the fdroiddata UpdateCheckMode:
          # Tags bot parsed 0.2.0 at the tagged commit, read the release as
          # "up to date", and silently skipped it. Pinning the commitish to
          # this run's checkout SHA (the tree the literal gate above just
          # verified) makes the tag's birth independent of publish timing.
          target_commitish: ${{ github.sha }}
