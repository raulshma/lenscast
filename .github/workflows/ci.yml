name: CI

on:
  push:
    branches:
      - main
      # Release branches run the same test suite as main: a signed release
      # (release.yml) must never be the first build that runs the tests.
      - 'v[0-9]+*'
      - 'release/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # JDK 21 matches the Gradle daemon toolchain
      # (gradle/gradle-daemon-jvm.properties); setup-java only bootstraps
      # it, the daemon JVM criteria pick the exact version.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Web UI — typecheck + unit tests
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Android — JVM unit tests (store flavor)
        run: ./gradlew :app:testStoreDebugUnitTest

      - name: Android — JVM unit tests (fdroid flavor)
        run: ./gradlew :app:testFdroidDebugUnitTest

      - name: Android — lint (store flavor, baseline-gated)
        run: ./gradlew :app:lintStoreDebug

      - name: Android — debug build (store flavor)
        run: ./gradlew :app:assembleStoreDebug

      - name: Wear — JVM unit tests
        run: ./gradlew :wear:testDebugUnitTest

      - name: Wear — debug build
        run: ./gradlew :wear:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**/*
            app/build/reports/lint-results-*.html
            app/build/outputs/apk/**/*
            wear/build/reports/tests/**/*
            wear/build/outputs/apk/**/*
          if-no-files-found: ignore
