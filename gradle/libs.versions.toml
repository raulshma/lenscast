[versions]
agp = "9.5.1"
# :app and :wear compile with AGP's built-in Kotlin, so this must stay in
# lockstep with the Kotlin Gradle Plugin version AGP embeds (9.5.1 → 2.2.10).
kotlin = "2.2.10"
ksp = "2.3.14"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
# registerForActivityResult needs fragment >= 1.3.0 (lint
# InvalidFragmentVersionForActivityResult); androidx.wear:wear pins an
# older fragment transitively, so :wear declares this pin explicitly.
fragment = "1.9.1"
composeBom = "2026.09.00"
# Held back from 2.10.x: those declare minSdk 24, but this app supports
# Android 6 (minSdk 23) and navigation runs on every device — no runtime
# gate possible. Bump together with minSdk.
navigation = "2.9.8"
camerax = "1.6.2"
# Held back from 2.12.0: it declares minSdk 24, but this app supports
# Android 6 (minSdk 23) and WorkManager initializes on every device — no
# runtime gate possible. Bump together with minSdk.
workManager = "2.11.2"
nanohttpd = "2.3.1"
nanohttpdWebsocket = "2.3.1"
# Held back from 1.3.0: it declares minSdk 24, but this app supports
# Android 6 (minSdk 23). Bump together with minSdk.
datastore = "1.2.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
coroutines = "1.11.0"
moshi = "1.15.2"
coil = "3.4.0"
media3 = "1.11.1"
zxing = "3.5.4"
streamWebrtc = "1.3.10"
robolectric = "4.18"
mockk = "1.14.12"
turbine = "1.2.1"
# MediaPipe Tasks (vision = ML object gate, audio = YAMNet) — plain
# libraries, no Play-services dependency (fdroid-safe).
mediaPipe = "1.2.3"
okhttp = "5.5.1"
wear = "1.4.0"
wearCompose = "1.7.1"
wearTiles = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
camerax-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
camerax-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "camerax" }

work-manager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
nanohttpd-ws = { group = "org.nanohttpd", name = "nanohttpd-websocket", version.ref = "nanohttpdWebsocket" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# MediaPipe Tasks for the app's ML detection gates (plain libraries, no
# Play-services dependency — see the pinned comments in app/build.gradle.kts).
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediaPipe" }
mediapipe-tasks-audio = { group = "com.google.mediapipe", name = "tasks-audio", version.ref = "mediaPipe" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Wear OS companion (:wear) — the stable wear-compose line and the Tiles
# stack for the watch-side remote and its tile.
wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-tiles-material = { group = "androidx.wear.tiles", name = "tiles-material", version.ref = "wearTiles" }

moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
coil-base = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

stream-webrtc-android = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "streamWebrtc" }

compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
