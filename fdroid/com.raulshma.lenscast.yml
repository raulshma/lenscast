Name: LensCast
AutoName: LensCast

RepoType: git
Repo: https://github.com/raulshma/lenscast.git

Builds:
  - versionName: 0.1.2
    versionCode: 1021
    commit: v0.1.2
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
    gradleprops:
      - abiFilter=armeabi-v7a

  - versionName: 0.1.2
    versionCode: 1022
    commit: v0.1.2
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    gradle:
      - fdroid
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
    gradleprops:
      - abiFilter=arm64-v8a

  - versionName: 0.1.2
    versionCode: 1023
    commit: v0.1.2
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
